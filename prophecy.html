const safeUrl = (u) => {
  try {
    const p = new URL(u, window.location.href);
    return (p.protocol === "http:" || p.protocol === "https:") ? p.href : "#";
  } catch (e) {
    return "#";
  }
};

const FulfillmentBar = ({ level, size = "md" }) => {
  const h = size === "sm" ? "h-1.5" : "h-2.5";
  const color = level >= 80 ? "bg-gradient-to-r from-amber-500 to-red-500 shadow-[0_0_8px_rgba(239,68,68,0.4)]"
    : level >= 50 ? "bg-gradient-to-r from-yellow-500 to-amber-500"
    : level >= 25 ? "bg-gradient-to-r from-yellow-700 to-yellow-600"
    : "bg-gray-500";
  return (
    <div className={`w-full ${h} bg-gray-700/60 rounded-full overflow-hidden`}>
      <div className={`${h} ${color} rounded-full transition-all duration-700`} style={{ width: `${level}%` }} />
    </div>
  );
};

const NewsFeed = () => {
  const [articles, setArticles] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [analysis, setAnalysis] = useState(null);
  const [analyzing, setAnalyzing] = useState(false);
  const [feed, setFeed] = useState(0);

  const fetchNews = useCallback(async () => {
    setLoading(true);
    setError(null);
    setArticles([]);
    try {
      const res = await fetch(
        `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_FEEDS[feed].url)}&count=12`
      );
      const data = await res.json();
      if (data.status === "ok" && data.items) setArticles(data.items.slice(0, 12));
      else throw new Error(data.message || "No articles");
    } catch (e) {
      setError(e.message);
    }
    setLoading(false);
  }, [feed]);

  const analyze = async () => {
    if (!articles.length) return;
    setAnalyzing(true);
    setAnalysis(null);
    try {
      const headlines = articles.map(a => `- ${a.title}`).join("\n");
      const pSummary = PROPHECIES.map(p => `[${p.id}] ${p.tradition}: ${p.title}`).join("\n");
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-5-20250929",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: `You are an eschatological analyst. Given these headlines:\n${headlines}\n\nAnd these prophecies:\n${pSummary}\n\nFind connections. Respond ONLY as JSON (no backticks): { "connections": [{ "headline": "...", "prophecyIds": ["..."], "prophecyTitles": ["..."], "explanation": "...", "relevance": "HIGH|MEDIUM|LOW" }], "summary": "2-sentence assessment" }`
          }]
        })
      });
      const data = await res.json();
      const text = data.content?.map(i => i.text || "").join("") || "";
      setAnalysis(JSON.parse(text.replace(/```json|```/g, "").trim()));
    } catch (e) {
      setAnalysis({ error: e.message });
    }
    setAnalyzing(false);
  };

  return (
    <div>
      <p className="text-gray-400 text-sm mb-3">
        Fetch news headlines from prophecy-relevant RSS feeds, then optionally use AI to analyze their connection to tracked prophecies.
      </p>
      <div className="flex flex-col sm:flex-row gap-2 mb-4">
        <select value={feed} onChange={e => setFeed(+e.target.value)}
          className="bg-gray-800 border border-gray-700 text-gray-200 text-sm rounded-lg p-2 flex-1">
          {RSS_FEEDS.map((f, i) => <option key={i} value={i}>{f.name}</option>)}
        </select>
        <div className="flex gap-2">
          <button onClick={fetchNews} disabled={loading}
            className="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white text-sm font-bold px-4 py-2 rounded-lg">
            {loading ? "Loading..." : "Fetch"}
          </button>
          {articles.length > 0 && (
            <button onClick={analyze} disabled={analyzing}
              className="bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white text-sm font-bold px-4 py-2 rounded-lg">
              {analyzing ? "..." : "AI Analyze"}
            </button>
          )}
        </div>
      </div>
      {error && (
        <div className="bg-red-900/30 border border-red-500/50 text-red-300 rounded-lg p-3 text-sm mb-4">{error}</div>
      )}
      {articles.length > 0 && (
        <div className="space-y-1.5 mb-4 max-h-80 overflow-y-auto">
          {articles.map((a, i) => (
            <a key={i} href={safeUrl(a.link)} target="_blank" rel="noopener noreferrer"
              className="block bg-gray-800/40 hover:bg-gray-700/40 border border-gray-700/50 rounded-lg p-3 transition">
              <p className="text-white text-sm font-medium leading-snug">{a.title}</p>
              <p className="text-gray-500 text-xs mt-1">{new Date(a.pubDate).toLocaleDateString()}</p>
            </a>
          ))}
        </div>
      )}
      {analysis && !analysis.error && (
        <div className="bg-purple-900/20 border border-purple-500/40 rounded-xl p-4 mt-4">
          <h3 className="text-purple-300 font-bold text-xs uppercase tracking-widest mb-2">AI Prophecy Analysis</h3>
          {analysis.summary && <p className="text-gray-300 text-sm mb-3 italic">{analysis.summary}</p>}
          <div className="space-y-2">
            {analysis.connections?.map((c, i) => (
              <div key={i} className={`rounded-lg p-3 border ${
                c.relevance === 'HIGH' ? 'bg-red-900/20 border-red-500/30' :
                c.relevance === 'MEDIUM' ? 'bg-amber-900/20 border-amber-500/30' :
                'bg-gray-800/40 border-gray-700/40'
              }`}>
                <div className="flex items-center gap-2 mb-1 flex-wrap">
                  <Badge className={
                    c.relevance === 'HIGH' ? 'bg-red-600 text-white' :
                    c.relevance === 'MEDIUM' ? 'bg-amber-600 text-white' :
                    'bg-gray-600 text-gray-200'
                  }>{c.relevance}</Badge>
                  <span className="text-gray-400 text-xs">{c.prophecyTitles?.join(" · ")}</span>
                </div>
                <p className="text-white text-sm">{c.headline}</p>
                <p className="text-gray-400 text-xs mt-1">{c.explanation}</p>
              </div>
            ))}
          </div>
        </div>
      )}
      {analysis?.error && (
        <div className="bg-red-900/20 border border-red-500/30 rounded-lg p-3 text-red-300 text-sm mt-4">
          Analysis failed: {analysis.error}
        </div>
      )}
    </div>
  );
};

const CrossLinks = ({ onSelect }) => {
  const groups = useMemo(() => {
    const g = [];
    const seen = new Set();
    PROPHECIES.forEach(p => {
      if (!p.linkedProphecies.length) return;
      const key = [p.id, ...p.linkedProphecies].sort().join(",");
      if (seen.has(key)) return;
      seen.add(key);
      const items = [p, ...p.linkedProphecies.map(lid => PROPHECIES.find(x => x.id === lid)).filter(Boolean)];
      const traditions = [...new Set(items.map(i => i.tradition))];
      if (traditions.length > 1) g.push({ key, items, traditions });
    });
    return g.sort((a, b) => b.traditions.length - a.traditions.length);
  }, []);

  return (
    <div className="space-y-4">
      <p className="text-gray-400 text-sm">
        Many Old Testament prophecies have both a Christian (christological) interpretation and a Jewish (messianic-era) interpretation. Islamic traditions sometimes parallel these themes through the Quran and Hadith. The connections below show how these prophetic threads weave together \u2014 with biblical prophecy as the primary thread.
      </p>
      {groups.map(g => (
        <div key={g.key} className="bg-gray-800/40 border border-gray-700 rounded-xl p-4">
          <div className="flex gap-1.5 mb-2">
            {g.traditions.map(t => <TBadge key={t} t={t} />)}
          </div>
          <div className="space-y-1.5">
            {g.items.map(item => {
              const c = TRADITION_COLORS[item.tradition];
              return (
                <button key={item.id} onClick={() => onSelect(item)}
                  className={`w-full text-left ${c.bg} border ${c.border} rounded-lg p-3 hover:brightness-125 transition`}>
                  <div className="flex items-center justify-between gap-2">
                    <div className="min-w-0">
                      <span className="text-white text-sm font-semibold block truncate">{item.title}</span>
                      <span className="text-gray-500 text-xs">{item.source}</span>
                    </div>
                    <span className={`text-sm font-bold shrink-0 ${
                      item.fulfillmentLevel >= 80 ? 'text-red-400' :
                      item.fulfillmentLevel >= 50 ? 'text-amber-400' : 'text-gray-500'
                    }`}>{item.fulfillmentLevel}%</span>
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
};

    const byT = {};

      byT[p.tradition].total += p.fulfillmentLevel;
      if (p.fulfillmentLevel >= 70) byT[p.tradition].high++;

    const avg = Math.round(PROPHECIES.reduce((s, p) => s + p.fulfillmentLevel, 0) / PROPHECIES.length);

          <div className={`${c.bg} border ${c.border} rounded-xl p-5`}>
            <TBadge t={t} />
            <div className="text-4xl font-black text-white mt-2">{avg}%</div>
            <FulfillmentBar level={avg} />
            <p className="text-gray-400 text-xs mt-1.5">{d.count} prophecies · {d.high} highly fulfilled</p>
          </div>
        );
      })()}
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        {["Jewish", "Islamic"].map(t => {
          const d = stats.byT[t];
          if (!d) return null;
          const c = TRADITION_COLORS[t];
          const avg = Math.round(d.total / d.count);
          return (
            <div key={t} className={`${c.bg} border ${c.border} rounded-xl p-4`}>
              <TBadge t={t} />
              <div className="text-3xl font-black text-white mt-2">{avg}%</div>
              <FulfillmentBar level={avg} size="sm" />
              <p className="text-gray-400 text-xs mt-1.5">{d.count} prophecies · {d.high} highly fulfilled</p>
            </div>
          );
        })}
      </div>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {[
          { label: "Most Fulfilled", list: stats.top, color: "text-red-400" },
          { label: "Awaiting Fulfillment", list: stats.bottom, color: "text-gray-400" }
        ].map(({ label, list, color }) => (
          <div key={label}>
            <h3 className={`${color} font-bold text-xs uppercase tracking-widest mb-2`}>{label}</h3>
            <div className="space-y-1.5">
              {list.map(p => (
                <button key={p.id} onClick={() => onSelect(p)}
                  className="w-full text-left bg-gray-800/40 hover:bg-gray-700/40 border border-gray-700/50 rounded-lg p-3 transition">
                  <div className="flex items-center gap-2 mb-1">
                    <TBadge t={p.tradition} />
                    <span className="text-white text-sm flex-1 truncate">{p.title}</span>
                    <span className={`font-bold text-sm ${
                      p.fulfillmentLevel >= 80 ? 'text-red-400' :
                      p.fulfillmentLevel >= 50 ? 'text-amber-400' : 'text-gray-500'
                    }`}>{p.fulfillmentLevel}%</span>
                  </div>
                  <FulfillmentBar level={p.fulfillmentLevel} size="sm" />
                </button>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
};

function App() {
  const [tab, setTab] = useState("dashboard");
  const [sel, setSel] = useState(null);
  const [search, setSearch] = useState("");
  const [fTrad, setFTrad] = useState("All");
  const [showScripture, setShowScripture] = useState({});
  const [fCat, setFCat] = useState("All");
  const [sort, setSort] = useState("tradition");

  const filtered = useMemo(() => {
    let l = PROPHECIES;
    if (fTrad !== "All") l = l.filter(p => p.tradition === fTrad);
    if (fCat !== "All") l = l.filter(p => p.category === fCat);
    if (search.trim()) {
      const q = search.toLowerCase();
      l = l.filter(p =>
        p.title.toLowerCase().includes(q) ||
        p.description.toLowerCase().includes(q) ||
        p.tags.some(t => t.includes(q)) ||
        p.source.toLowerCase().includes(q)
      );
    }
    if (sort === "fulfillment") l = [...l].sort((a, b) => b.fulfillmentLevel - a.fulfillmentLevel);
    else if (sort === "alpha") l = [...l].sort((a, b) => a.title.localeCompare(b.title));
    else {
      const order = { Christian: 0, Jewish: 1, Islamic: 2 };
      l = [...l].sort((a, b) => {
        const tDiff = (order[a.tradition] ?? 9) - (order[b.tradition] ?? 9);
        if (tDiff !== 0) return tDiff;
        return b.fulfillmentLevel - a.fulfillmentLevel;
      });
    }
    return l;
  }, [fTrad, fCat, search, sort]);

  const tabs = [
    { k: "dashboard", l: "Dashboard" },
    { k: "prophecies", l: "Prophecies" },
    { k: "expectations", l: "What Do They Expect?" },
    { k: "crosslinks", l: "Cross-Tradition" },
    { k: "news", l: "News Watch" },
  ];

  return (
    <div className="min-h-screen bg-gray-950 text-white" style={{ fontFamily: "'Inter', system-ui, sans-serif" }}>
      <div className="bg-gradient-to-b from-gray-900 via-gray-900 to-gray-950 border-b border-gray-800">
        <div className="max-w-5xl mx-auto px-4 py-5">
          <div className="flex items-center gap-3 mb-0.5">
            <div className="text-2xl text-indigo-400">&#9769;</div>
            <h1 className="text-xl sm:text-2xl font-black tracking-tight uppercase bg-gradient-to-r from-white via-indigo-200 to-white bg-clip-text text-transparent">Eschaton Watch</h1>
            <a href="index.html" className="ml-auto text-gray-500 hover:text-gray-300 text-xs font-semibold whitespace-nowrap">&larr; Bible Progress</a>
          </div>
          <p className="text-gray-500 text-xs sm:text-sm ml-9">
            Biblical prophecy tracker &mdash; rooted in Scripture, with Jewish &amp; Islamic perspectives
          </p>
          <div className="flex gap-1 mt-4 bg-gray-800/50 rounded-lg p-1 overflow-x-auto">
            {tabs.map(t => (
              <button key={t.k} onClick={() => setTab(t.k)}
                className={`px-3 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-semibold transition whitespace-nowrap ${
                  tab === t.k
                    ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/20'
                    : 'text-gray-400 hover:text-white'
                }`}>
                {t.l}
              </button>
            ))}
          </div>
        </div>
      </div>

      <div className="max-w-5xl mx-auto px-4 py-5">
        {tab === "dashboard" && <Dashboard onSelect={setSel} />}

        {tab === "prophecies" && (
          <div>
            <div className="flex flex-col sm:flex-row gap-2 mb-3">
              <input type="text" placeholder="Search..." value={search} onChange={e => setSearch(e.target.value)}
                className="bg-gray-800 border border-gray-700 text-white text-sm rounded-lg px-3 py-2 flex-1 placeholder-gray-500 focus:border-indigo-500 focus:outline-none" />
              <select value={fTrad} onChange={e => setFTrad(e.target.value)}
                className="bg-gray-800 border border-gray-700 text-gray-200 text-sm rounded-lg px-3 py-2">
                <option value="All">All Traditions</option>
                <option>Christian</option>
                <option>Jewish</option>
                <option>Islamic</option>
              </select>
              <select value={fCat} onChange={e => setFCat(e.target.value)}
                className="bg-gray-800 border border-gray-700 text-gray-200 text-sm rounded-lg px-3 py-2">
                <option value="All">All Categories</option>
                {CATEGORIES.map(c => <option key={c}>{c}</option>)}
              </select>
              <select value={sort} onChange={e => setSort(e.target.value)}
                className="bg-gray-800 border border-gray-700 text-gray-200 text-sm rounded-lg px-3 py-2">
                <option value="fulfillment">By Fulfillment</option>
                <option value="alpha">A&ndash;Z</option>
                <option value="tradition">By Tradition</option>
              </select>
            </div>
            <p className="text-gray-600 text-xs mb-3">{filtered.length} prophecies</p>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">
              {filtered.map(p => {
                const c = TRADITION_COLORS[p.tradition];
                const isScriptureOpen = showScripture[p.id];
                return (
                  <div key={p.id} className={`text-left ${c.bg} border ${c.border} rounded-xl p-4 transition duration-200 group hover:-translate-y-0.5 hover:shadow-lg ${c.glow}`}>
                    <div className="cursor-pointer hover:brightness-110" onClick={() => setSel(p)}>
                      <div className="flex items-center gap-1.5 mb-1 flex-wrap">
                        <TBadge t={p.tradition} />
                        <Badge className="bg-gray-700/80 text-gray-300">{p.category}</Badge>
                        {p.linkedProphecies.length > 0 && (
                          <span className="text-gray-600 text-xs ml-auto">&#128279; {p.linkedProphecies.length}</span>
                        )}
                      </div>
                      <h3 className="text-white font-bold text-sm mt-1 group-hover:underline">{p.title}</h3>
                      <p className={`text-xs ${c.text} font-mono mt-0.5 mb-1.5`}>{p.source}</p>
                      <p className="text-gray-400 text-xs leading-relaxed mb-2"
                        style={{ display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>
                        {p.description}
                      </p>
                    </div>
                    <button onClick={(e) => { e.stopPropagation(); setShowScripture(prev => ({ ...prev, [p.id]: !prev[p.id] })); }}
                      className="text-[10px] font-semibold uppercase tracking-wider text-gray-500 hover:text-gray-300 mb-1.5 flex items-center gap-1 transition">
                      <span className={`inline-block transition-transform ${isScriptureOpen ? 'rotate-90' : ''}`}>&#9654;</span>
                      Scripture
                    </button>
                    {isScriptureOpen && (
                      <div className="bg-black/40 border border-gray-700 rounded-lg p-3 mb-2 italic text-gray-300 text-xs leading-relaxed">
                        &ldquo;{p.sourceText}&rdquo;
                        <p className={`not-italic font-mono ${c.text} text-[10px] mt-1.5`}>&mdash; {p.source}</p>
                      </div>
                    )}
                    <div className="flex items-center gap-2">
                      <div className="flex-1"><FulfillmentBar level={p.fulfillmentLevel} size="sm" /></div>
                      <span className={`text-xs font-bold ${
                        p.fulfillmentLevel >= 80 ? 'text-red-400' :
                        p.fulfillmentLevel >= 50 ? 'text-amber-400' : 'text-gray-500'
                      }`}>{p.fulfillmentLevel}%</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {tab === "expectations" && <Expectations />}
        {tab === "crosslinks" && <CrossLinks onSelect={setSel} />}
        {tab === "news" && <NewsFeed />}
      </div>

      {sel && <ProphecyDetail prophecy={sel} onClose={() => setSel(null)} onNav={setSel} />}

      <div className="max-w-5xl mx-auto px-4 py-6 border-t border-gray-800 mt-6">
        <p className="text-gray-700 text-[10px] text-center leading-relaxed">
          Eschaton Watch is a Bible-centered prophecy tracker that also examines how Jewish and Islamic traditions understand these same prophetic themes.
          Fulfillment percentages are subjective assessments based on observable trends and should not be taken as doctrinal claims.
          Sources: KJV Bible, Talmud, Sahih Bukhari, Sahih Muslim, and other canonical texts. For study and discussion purposes only.
        </p>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
