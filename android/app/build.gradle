plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bibleprogress.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.bibleprogress.app"
        minSdk 19
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // TWA asset statements — links to the web domain
        resValue "string", "assetStatements", """
            [{
                "relation": ["delegate_permission/common.handle_all_urls"],
                "target": {
                    "namespace": "web",
                    "site": "https://bibleprogress.com"
                }
            }]
        """.trim()
    }

    signingConfigs {
        release {
            // To build a release, create a file at android/keystore.properties with:
            //   storeFile=../bible-progress.keystore
            //   storePassword=your_password
            //   keyAlias=bible-progress
            //   keyPassword=your_password
            //
            // See PLAY_STORE.md for full instructions.
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
