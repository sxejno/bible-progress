<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Bible Progress</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="theme-color" content="#4f46e5">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            background: #fff;
            border: 1px solid #e0e7ff;
            border-radius: 2rem;
            box-shadow: 0 20px 40px rgba(79, 70, 229, .08);
            padding: 3rem 2rem;
            max-width: 26rem;
            text-align: center;
        }
        .verse { color: #64748b; font-size: .875rem; font-style: italic; margin: 1rem 0 2rem; line-height: 1.6; }
        h1 { font-size: 3rem; font-weight: 900; color: #4f46e5; letter-spacing: -0.03em; }
        h2 { font-size: 1.25rem; font-weight: 800; margin-top: .5rem; }
        a.home {
            display: inline-block;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: #fff;
            font-weight: 700;
            font-size: .875rem;
            text-decoration: none;
            padding: .75rem 2rem;
            border-radius: 9999px;
            transition: transform .15s ease, box-shadow .15s ease;
            box-shadow: 0 10px 20px rgba(79, 70, 229, .25);
        }
        a.home:hover { transform: translateY(-1px); box-shadow: 0 14px 28px rgba(79, 70, 229, .3); }
        .emoji { font-size: 3rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <main class="card">
        <div class="emoji">📖</div>
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p class="verse">"I have gone astray like a lost sheep; seek thy servant"<br>— Psalm 119:176</p>
        <a class="home" href="/">Back to Bible Progress</a>
    </main>
</body>
</html>
